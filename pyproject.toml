[project]
name = "momentum-backend"
version = "0.1.0"
description = "Momentum fitness backend — LLM coaching, aggregation, integrations over Supabase Postgres."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "structlog>=24.4",
    "tenacity>=9.0",
    "sentry-sdk[fastapi]>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------- Ruff (lint + format) -----------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"] # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # hardcoded test secrets/tokens are fine

# ----------------------------- mypy (strict) -----------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# ----------------------------- pytest -----------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
